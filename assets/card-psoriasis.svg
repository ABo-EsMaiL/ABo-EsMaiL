<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="Psoriasis Classification: Compared classic ML, CNNs and transfer learning. Served by a FastAPI + Docker API with TFLite-optimized models.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#1b1646"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.3" r="0.7"><stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="478" height="228" rx="18" fill="url(#g)"/>
<rect x="1" y="1" width="478" height="228" rx="18" fill="url(#glow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></rect>
<rect x="1.5" y="1.5" width="477" height="227" rx="18" fill="none" stroke="#f472b6" stroke-opacity="0.22"/>
<rect x="1.5" y="1.5" width="477" height="227" rx="18" fill="none" stroke="url(#b)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 890" pathLength="1000"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="5s" repeatCount="indefinite"/></rect>
<text x="24" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">Psoriasis Classification</text>
<text x="24" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#f472b6">Graduation project, 12 skin-condition classes</text>
<text x="24" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">Compared classic ML, CNNs and transfer</text><text x="24" y="121" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">learning. Served by a FastAPI + Docker</text><text x="24" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">API with TFLite-optimized models.</text><rect x="24" y="186" width="92" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.5"/><text x="70" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">TensorFlow</text><rect x="123" y="186" width="78" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.5"/><text x="162" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">Xception</text><rect x="208" y="186" width="70" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.5"/><text x="243" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">FastAPI</text><rect x="285" y="186" width="63" height="24" rx="12" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.5"/><text x="317" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">Docker</text>
<g transform="translate(312,46)"><g transform="translate(75,62)"><circle r="48" fill="none" stroke="#1e293b" stroke-width="10"/>
<circle r="48" fill="none" stroke="#f472b6" stroke-width="10" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="301.6" stroke-dashoffset="301.6"><animate attributeName="stroke-dashoffset" values="301.6;9.0;9.0;301.6" keyTimes="0;0.4;0.9;1" dur="5s" repeatCount="indefinite"/></circle>
<text y="6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">~97%</text>
<text y="24" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">Xception, 224 test images</text></g></g>
