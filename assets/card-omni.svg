<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="Omni Enterprise AI Agent: Stateful agent with a manual ReAct loop, session memory and tool calling, served with FastAPI and Pydantic.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#1b1646"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.3" r="0.7"><stop offset="0" stop-color="#818cf8" stop-opacity="0.22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="478" height="228" rx="18" fill="url(#g)"/>
<rect x="1" y="1" width="478" height="228" rx="18" fill="url(#glow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></rect>
<rect x="1.5" y="1.5" width="477" height="227" rx="18" fill="none" stroke="#818cf8" stroke-opacity="0.22"/>
<rect x="1.5" y="1.5" width="477" height="227" rx="18" fill="none" stroke="url(#b)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 890" pathLength="1000"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="5s" repeatCount="indefinite"/></rect>
<text x="24" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">Omni Enterprise AI Agent</text>
<text x="24" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#818cf8">Custom agentic workflow</text>
<text x="24" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">Stateful agent with a manual ReAct</text><text x="24" y="121" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">loop, session memory and tool calling,</text><text x="24" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">served with FastAPI and Pydantic.</text><rect x="24" y="186" width="63" height="24" rx="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.5"/><text x="56" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">Python</text><rect x="94" y="186" width="70" height="24" rx="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.5"/><text x="129" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">FastAPI</text><rect x="172" y="186" width="63" height="24" rx="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.5"/><text x="203" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">Ollama</text><rect x="242" y="186" width="78" height="24" rx="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.5"/><text x="281" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0">Qwen 2.5</text>
<g transform="translate(312,46)"><path d="M75,10 L140,110 L10,110 Z" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5"/><circle cx="75" cy="10" r="15" fill="#0b1222" stroke="#818cf8" stroke-width="2"/><circle cx="75" cy="10" r="15" fill="#818cf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0.000;0.060;0.220;1" dur="4.5s" repeatCount="indefinite"/></circle><text x="75" y="-12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">Thought</text><circle cx="140" cy="110" r="15" fill="#0b1222" stroke="#818cf8" stroke-width="2"/><circle cx="140" cy="110" r="15" fill="#818cf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0.333;0.393;0.553;1" dur="4.5s" repeatCount="indefinite"/></circle><text x="140" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">Action</text><circle cx="10" cy="110" r="15" fill="#0b1222" stroke="#818cf8" stroke-width="2"/><circle cx="10" cy="110" r="15" fill="#818cf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0.667;0.727;0.887;1" dur="4.5s" repeatCount="indefinite"/></circle><text x="10" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">Observe</text><circle r="5" fill="#fff"><animateMotion path="M75,10 L140,110 L10,110 Z" dur="4.5s" repeatCount="indefinite"/></circle></g>
